name: Supabase Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'   # Weekly on Sunday at 2:00 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  backup:
    name: Backup Supabase DB → GitHub Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Install PostgreSQL 17 client (must match Supabase server version) ─
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

          # Force system to use pg_dump v17
          sudo update-alternatives --install /usr/bin/pg_dump pg_dump /usr/lib/postgresql/17/bin/pg_dump 17
          sudo update-alternatives --set pg_dump /usr/lib/postgresql/17/bin/pg_dump
          pg_dump --version

      # ── 2. Dump the database ─────────────────────────────────────────────────
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          FILENAME="backup_${TIMESTAMP}.dump"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-acl \
            --no-owner \
            --file="$FILENAME"

          echo "✅ Backup created: $FILENAME ($(du -sh $FILENAME | cut -f1))"

      # ── 3. Upload to GitHub Artifacts ────────────────────────────────────────
      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 90
          if-no-files-found: error

      # ── 4. Delete old artifacts (only runs if upload succeeded) ──────────────
      - name: Delete old artifacts
        if: steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Fetching old artifacts..."

          # List all artifacts, filter out the one just uploaded, delete the rest
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts \
            --paginate \
            --jq '.artifacts[] | select(.name | startswith("backup_")) | select(.name != "${{ env.FILENAME }}") | .id' \
          | while read -r ARTIFACT_ID; do
              echo "🗑️  Deleting artifact ID: $ARTIFACT_ID"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                /repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID
            done

          echo "✅ Old artifacts cleaned up."

      # ── 5. Delete local dump file ─────────────────────────────────────────────
      - name: Clean up local file
        if: always()
        run: rm -f "$FILENAME"

      # ── 6. Notify SUCCESS via Telegram ───────────────────────────────────────
      - name: Telegram — success notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ *Supabase Backup Successful*%0A%0A📦 File: %60${FILENAME}%60%0A📅 Date: $(date '+%Y-%m-%d %H:%M:%S UTC')%0A☁️ Stored in: GitHub Artifacts (90 days retention)%0A🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data "chat_id=${TELEGRAM_CHAT_ID}&text=${MESSAGE}&parse_mode=Markdown"

      # ── 7. Notify FAILURE via Telegram ───────────────────────────────────────
      - name: Telegram — failure notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌ *Supabase Backup FAILED*%0A%0A📅 Date: $(date '+%Y-%m-%d %H:%M:%S UTC')%0A🔗 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data "chat_id=${TELEGRAM_CHAT_ID}&text=${MESSAGE}&parse_mode=Markdown"